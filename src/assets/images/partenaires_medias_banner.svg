<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 240" width="1480" height="240">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&amp;display=swap");
      .title { font-family: "Montserrat", sans-serif; font-weight: 800; fill: #475569; letter-spacing: 0.12em; font-size: 30px; }
      .ae-main { font-family: "Montserrat", sans-serif; font-weight: 900; fill: #0f172a; font-size: 48px; letter-spacing: -0.03em; }
      .ae-sub { font-family: "Montserrat", sans-serif; font-weight: 700; fill: #1e293b; font-size: 10px; letter-spacing: 0.12em; }
      .ch-main { font-family: "Montserrat", sans-serif; font-weight: 900; fill: #d9242a; font-size: 30px; letter-spacing: -0.02em; }
      .ch-sub { font-family: "Montserrat", sans-serif; font-weight: 700; fill: #0f172a; font-size: 20px; }
      .ch-tag { font-family: "Montserrat", sans-serif; font-weight: 700; fill: #334155; font-size: 10px; line-height: 1.25; }
      .tc-main { font-family: "Montserrat", sans-serif; font-weight: 700; fill: #0f172a; font-size: 34px; letter-spacing: -0.02em; }
      .tc-dot { font-family: "Montserrat", sans-serif; font-weight: 900; fill: #0f172a; font-size: 17px; }
      .kp-main { font-family: "Montserrat", sans-serif; font-weight: 900; fill: #e11d48; font-size: 34px; letter-spacing: 0.08em; }
      .kp-sub { font-family: "Montserrat", sans-serif; font-weight: 600; fill: #e11d48; font-size: 12px; letter-spacing: 0.02em; }
      .ao-main { font-family: "Montserrat", sans-serif; font-weight: 900; fill: #0369a1; font-size: 28px; letter-spacing: 0.04em; }
      .ao-sub { font-family: "Montserrat", sans-serif; font-weight: 800; fill: #0f172a; font-size: 17px; letter-spacing: 0.08em; }
      .ao-tag { font-family: "Montserrat", sans-serif; font-weight: 700; fill: #475569; font-size: 9.5px; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <!-- Section Title -->
  <text x="740" y="52" text-anchor="middle" class="title">PARTENAIRES MÉDIAS</text>

  <!-- 1. A+E -->
  <g transform="translate(45, 115)">
    <text x="75" y="40" text-anchor="middle" class="ae-main">A+E°</text>
    <text x="75" y="62" text-anchor="middle" class="ae-sub">ARCHITECTURE &amp; ENVIRONNEMENT AU MAROC</text>
  </g>

  <!-- 2. CHANTIERS DU MAROC -->
  <g transform="translate(325, 122)">
    <text x="0" y="24" class="ch-main">CHANTIERS</text>
    <text x="0" y="50" class="ch-sub">du Maroc <tspan font-weight="900" font-size="18">.ma</tspan></text>
    <line x1="190" y1="5" x2="190" y2="56" stroke="#d9242a" stroke-width="2" />
    <text x="200" y="16" class="ch-tag">1<tspan font-size="8" dy="-3">er</tspan><tspan dy="3"> Magazine</tspan></text>
    <text x="200" y="29" class="ch-tag">de l'actualité</text>
    <text x="200" y="42" class="ch-tag">du secteur</text>
    <text x="200" y="55" class="ch-tag">de la construction</text>
  </g>

  <!-- 3. ATLAS ORIGINAL -->
  <g transform="translate(640, 122)">
    <text x="0" y="24" class="ao-main">ATLAS</text>
    <text x="0" y="48" class="ao-sub">ORIGINAL</text>
    <line x1="125" y1="5" x2="125" y2="56" stroke="#0284c7" stroke-width="2" />
    <text x="135" y="18" class="ao-tag">L'Ouvrage de</text>
    <text x="135" y="32" class="ao-tag">référence</text>
    <text x="135" y="46" class="ao-tag">économique</text>
    <text x="135" y="58" class="ao-tag" fill="#0284c7">atlasoriginal.net</text>
  </g>

  <!-- 4. TELECONTACT -->
  <g transform="translate(935, 138)">
    <text x="0" y="30" class="tc-main">Telecontact.</text>
    <circle cx="210" cy="18" r="21" fill="#fed000" />
    <text x="210" y="24" text-anchor="middle" class="tc-dot">ma</text>
  </g>

  <!-- 5. KOMPASS -->
  <g transform="translate(1210, 138)">
    <text x="80" y="24" text-anchor="middle" class="kp-main">KOMPASS</text>
    <text x="80" y="44" text-anchor="middle" class="kp-sub">Your route to business worldwide</text>
  </g>
</svg>